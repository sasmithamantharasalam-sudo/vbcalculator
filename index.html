<!DOCTYPE html>
<html>
<head>
    <title>Voice-Based Calculator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 25px;
            text-align: right;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .voice-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .voice-button:hover {
            background: #444;
        }

        #message {
            min-height: 25px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e9ecef;
        }

        button:hover {
            background: #d6d9dc;
        }

        .operator {
            background: #ddd;
        }

        .equal {
            background: #222;
            color: white;
        }

        .clear {
            background: #ccc;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>🎙️ Voice-Based Calculator</h1>

    <input type="text" id="display" placeholder="Enter calculation" readonly>

    <button class="voice-button" onclick="startVoice()">
        🎤 Speak
    </button>

    <div id="message"></div>

    <div class="buttons">

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button class="clear" onclick="clearDisplay()" style="grid-column: span 4;">
            Clear
        </button>

    </div>

    <div class="result">
        Result: <span id="result">0</span>
    </div>

</div>

<script>

    function addValue(value) {
        document.getElementById("display").value += value;
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
        document.getElementById("result").innerText = "0";
        document.getElementById("message").innerText = "";
    }

    function calculate() {

        let expression = document.getElementById("display").value;

        if (expression === "") {
            return;
        }

        try {

            let answer = Function("return " + expression)();

            document.getElementById("result").innerText = answer;

        } catch (error) {

            document.getElementById("result").innerText = "Error";

        }
    }

    function startVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            document.getElementById("message").innerText =
                "Voice recognition is not supported in this browser.";

            return;
        }

        const recognition = new SpeechRecognition();

        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = false;

        document.getElementById("message").innerText =
            "🎤 Listening...";

        recognition.start();

        recognition.onresult = function(event) {

            let speech =
                event.results[0][0].transcript.toLowerCase();

            document.getElementById("message").innerText =
                "You said: " + speech;

            let expression = convertSpeech(speech);

            document.getElementById("display").value =
                expression;

            calculate();
        };

        recognition.onerror = function() {

            document.getElementById("message").innerText =
                "Could not recognize your voice. Try again.";

        };
    }

    function convertSpeech(text) {

        text = text
            .replace(/plus/g, "+")
            .replace(/add/g, "+")
            .replace(/minus/g, "-")
            .replace(/subtract/g, "-")
            .replace(/times/g, "*")
            .replace(/multiplied by/g, "*")
            .replace(/multiply/g, "*")
            .replace(/divided by/g, "/")
            .replace(/divide/g, "/")
            .replace(/ /g, "");

        return text;
    }

</script>

</body>
</html
