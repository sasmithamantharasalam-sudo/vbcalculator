<!DOCTYPE html>
<html>
<head>
    <title>Voice-Based Calculator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .top {
            height: 80px;
            background: #3f51b5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .screen {
            font-size: 32px;
        }

        .menu {
            font-size: 35px;
        }

        .content {
            margin-top: 480px;
        }

        .heading {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            margin: 20px;
        }

        .value {
            font-size: 25px;
            margin-bottom: 30px;
        }

        #ask {
            padding: 15px 20px;
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            background: #d8d8d8;
            border: none;
            border-radius: 4px;
            box-shadow: 0 3px 6px #999;
        }
    </style>
</head>

<body>

    <div class="top">
        <div class="screen">Screen1</div>
        <div class="menu">⋮</div>
    </div>

    <div class="content">

        <div class="heading">
            QUESTION
        </div>

        <div class="value" id="question">
            -
        </div>

        <div class="heading">
            ANSWER
        </div>

        <div class="value" id="answer">
            -
        </div>

        <button id="ask" onclick="startVoice()">
            ASK A QUESTION
        </button>

    </div>

    <script>

        function startVoice() {

            var SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Voice recognition is not supported.");
                return;
            }

            var recognition = new SpeechRecognition();

            recognition.lang = "en-US";

            recognition.start();

            document.getElementById("question").innerText =
                "Listening...";

            recognition.onresult = function(event) {

                var text =
                    event.results[0][0].transcript;

                document.getElementById("question").innerText =
                    text;

                var answer = calculate(text);

                document.getElementById("answer").innerText =
                    answer;
            };
        }


        function calculate(text) {

            text = text.toLowerCase();

            text = text.replace(/plus/g, "+");
            text = text.replace(/add/g, "+");

            text = text.replace(/minus/g, "-");
            text = text.replace(/subtract/g, "-");

            text = text.replace(/times/g, "*");
            text = text.replace(/multiply/g, "*");
            text = text.replace(/multiplied by/g, "*");

            text = text.replace(/divided by/g, "/");
            text = text.replace(/divide/g, "/");

            text = text.replace(/\s/g, "");

            try {

                if (/^[0-9+\-*/.]+$/.test(text)) {

                    return Function("return " + text)();

                } else {

                    return "Unable to calculate";
                }

            } catch (error) {

                return "Invalid calculation";
            }
        }

    </script>

</body>
</html>
