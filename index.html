<!DOCTYPE html>
<html>
<head>
    <title>Voice-Based Calculator</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: "Comic Sans MS", cursive, sans-serif;
        }

        /* Top bar */
        .topbar {
            height: 80px;
            background: #3f51b5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            font-size: 32px;
        }

        .title {
            font-size: 32px;
        }

        .menu {
            font-size: 35px;
        }

        /* Main area */
        .container {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 45vh;
        }

        .section {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading {
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 12px;
        }

        .value {
            font-size: 26px;
            min-height: 35px;
        }

        /* Ask button */
        .ask-button {
            border: none;
            background: #d9d9d9;
            padding: 15px 22px;
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 24px;
            font-style: italic;
            cursor: pointer;

            box-shadow: 0 3px 7px rgba(0,0,0,0.25);
        }

        .ask-button:active {
            transform: scale(0.97);
        }
